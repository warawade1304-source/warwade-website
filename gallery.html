<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>फोटो गॅलरी | ग्रामपंचायत वरवडे</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f8;
}

/* Header */
.top-header{
    text-align:center;
    padding:18px;
    font-size:26px;
    font-weight:bold;
    background: linear-gradient(to right,#ff9933,#ffffff,#138808);
}

/* Menu */
.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    background:#003f7f;
}
.menu a{
    color:white;
    padding:12px 16px;
    text-decoration:none;
    font-weight:bold;
}
.menu a:hover{
    background:#002a55;
}

/* Gallery */
.container{
    max-width:1400px;
    margin:20px auto;
    padding:10px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
}

.photo-box{
    background:white;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    cursor:pointer;
}

.photo-box img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.caption{
    padding:6px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#003f7f;
}

/* Lightbox */
.lightbox{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.lightbox img{
    max-width:95%;
    max-height:90%;
    border-radius:6px;
}

.close{
    position:absolute;
    top:15px;
    right:25px;
    font-size:32px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* Responsive */
@media(max-width:900px){
    .gallery{ grid-template-columns:repeat(3,1fr); }
}
@media(max-width:600px){
    .gallery{ grid-template-columns:repeat(2,1fr); }
}
</style>

</head>

<body>

<div class="top-header">📸 फोटो गॅलरी – ग्रामपंचायत वरवडे</div>

<!-- Menu -->
<div class="menu">
    <a href="index.html">मुख्य पान</a>
    <a href="panch-info.html">पंचायतीची माहिती</a>
    <a href="documents.html">शासकीय योजना</a>
    <a href="notices.html">नोटीस बोर्ड</a>
    <a href="gallery.html">फोटो गॅलरी</a>
    <a href="tax.html">मालमत्ता कर</a>
    <a href="contact.html">संपर्क</a>
</div>

<div class="container">
<div class="gallery">
<p style="grid-column:1/-1;text-align:center;color:#999;padding:20px">अजून कोणतेही फोटो जोडलेले नाहीत.</p>
</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closePhoto()">
    <span class="close">&times;</span>
    <img id="lightboxImg">
</div>

<script>
function openPhoto(el){
    document.getElementById("lightboxImg").src = el.querySelector("img").src;
    document.getElementById("lightbox").style.display = "flex";
}
function closePhoto(){
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
